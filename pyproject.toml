[project]
name = "gallery"
version = "0.1.0"
description = "Gallery: the AI producer's desk for match-day studios (synthetic data only)"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.1",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "agent-framework-core==1.23.0",
    "agent-framework-openai==1.17.0",
    "openai==3.37.0",
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gallery*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
