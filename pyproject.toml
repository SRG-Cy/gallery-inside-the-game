[project]
name = "gallery"
version = "0.1.0"
description = "Gallery: the AI producer's desk for match-day studios (synthetic data only)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "agent-framework-core>=1.23",
    "agent-framework-openai>=1.23",
    "mcp>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gallery*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
